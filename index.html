<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ভবিষ্যৎ বউ কে?</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(145deg,#ff7195,#ff4f9a,#8d4de8);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
}

.game{
  width:100%;
  max-width:520px;
  text-align:center;
  padding:20px 12px 35px;
}

h1{
  color:white;
  font-size:32px;
  margin:8px 0;
  text-shadow:2px 3px 4px #9b2862;
}

.subtitle{
  color:white;
  font-size:18px;
  margin-bottom:18px;
}

.wheelArea{
  position:relative;
  width:min(94vw,420px);
  aspect-ratio:1;
  margin:auto;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.3));
}

.pointer{
  position:absolute;
  top:-3px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:25px solid transparent;
  border-right:25px solid transparent;
  border-top:58px solid #222;
  z-index:5;
}

.pointer:after{
  content:"";
  position:absolute;
  left:-17px;
  top:-55px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#ff174f;
  border:5px solid white;
}

.spinBtn{
  margin-top:25px;
  width:270px;
  max-width:80%;
  padding:17px 25px;
  border:0;
  border-radius:50px;
  background:#222;
  color:white;
  font-size:24px;
  font-weight:bold;
  box-shadow:0 7px 0 #111;
  cursor:pointer;
}

.spinBtn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #111;
}

.spinBtn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.result{
  margin:25px auto 0;
  width:92%;
  min-height:70px;
  background:white;
  border-radius:22px;
  padding:17px;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,.25);
}

</style>
</head>

<body>

<div class="game">

  <h1>💍 ভবিষ্যৎ বউ কে?</h1>

  <div class="subtitle">
    মজার ছলে Wheel ঘুরিয়ে দেখো! 😍
  </div>

  <div class="wheelArea">

    <div class="pointer"></div>

    <canvas id="wheel" width="700" height="700"></canvas>

  </div>

  <button class="spinBtn" id="spinBtn">
    🎡 SPIN
  </button>

  <div class="result" id="result">
    ❤️ Spin করো, নাম দেখো!
  </div>

</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const button = document.getElementById("spinBtn");
const result = document.getElementById("result");

const names = [
  "সুমাইয়া",
  "মিম",
  "সাদিয়া",
  "নুসরাত",
  "তানজিলা",
  "জান্নাত",
  "ফারিয়া",
  "মাহি",
  "আয়েশা",
  "নিশাত"
];

const colors = [
  "#ff4d5e",
  "#ffc83d",
  "#78c91d",
  "#1688c9",
  "#674895",
  "#ff914d",
  "#f04cae",
  "#00bfae",
  "#7a4dcc",
  "#fff45c"
];

let rotation = 0;
let spinning = false;

const center = 350;
const radius = 315;
const slice = (Math.PI * 2) / names.length;


/* =========================
   DRAW WHEEL
========================= */

function drawWheel(){

  ctx.clearRect(0,0,700,700);

  ctx.save();

  ctx.translate(center,center);
  ctx.rotate(rotation);

  for(let i=0;i<names.length;i++){

    const start = i * slice - Math.PI/2;
    const end = start + slice;

    // Segment
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,radius,start,end);
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    // White dividing line
    ctx.strokeStyle = "white";
    ctx.lineWidth = 5;
    ctx.stroke();


    // Name
    const middle = start + slice/2;

    ctx.save();

    ctx.rotate(middle);

    ctx.translate(radius * 0.67,0);

    ctx.rotate(Math.PI/2);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Text shadow
    ctx.shadowColor = "rgba(0,0,0,.35)";
    ctx.shadowBlur = 3;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    ctx.fillStyle = "white";

    let fontSize = 31;

    // ছোট স্ক্রিনেও নাম যেন ভিতরে থাকে
    ctx.font = `bold ${fontSize}px Arial, "Noto Sans Bengali", sans-serif`;

    ctx.fillText(names[i],0,0);

    ctx.restore();
  }

  ctx.restore();


  // Outer white border
  ctx.beginPath();
  ctx.arc(center,center,radius,0,Math.PI*2);

  ctx.strokeStyle="white";
  ctx.lineWidth=15;
  ctx.stroke();


  // Center circle
  ctx.beginPath();
  ctx.arc(center,center,65,0,Math.PI*2);

  ctx.fillStyle="white";
  ctx.fill();

  ctx.lineWidth=12;
  ctx.strokeStyle="#222";
  ctx.stroke();


  // Heart
  ctx.font="42px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#ff1764";
  ctx.fillText("♥",center,center);

}


/* প্রথমবার Wheel দেখাও */
drawWheel();


/* =========================
   SPIN
========================= */

button.addEventListener("click",function(){

  if(spinning) return;

  spinning = true;
  button.disabled = true;

  result.innerHTML = "🎡 Wheel ঘুরছে... 😍";

  // 6-9 বার ঘুরবে
  const extraSpins =
    (6 + Math.floor(Math.random()*4)) * Math.PI * 2;

  // Random final position
  const randomAngle = Math.random() * Math.PI * 2;

  const startRotation = rotation;

  const targetRotation =
    rotation + extraSpins + randomAngle;

  const duration = 5000;

  const startTime = performance.now();


  function animate(time){

    const elapsed = time - startTime;

    let progress = elapsed / duration;

    if(progress > 1) progress = 1;


    // Smooth deceleration
    const ease =
      1 - Math.pow(1-progress,4);

    rotation =
      startRotation +
      (targetRotation-startRotation) * ease;

    drawWheel();


    if(progress < 1){

      requestAnimationFrame(animate);

    }else{

      spinning = false;
      button.disabled = false;

      showWinner();

    }

  }

  requestAnimationFrame(animate);

});


/* =========================
   WINNER
========================= */

function showWinner(){

  /*
   Pointer সবসময় উপরে।
   Wheel-এর কোন নাম pointer-এর নিচে আছে
   সেটা হিসাব করা হচ্ছে।
  */

  let normalized =
    ((-rotation % (Math.PI*2)) + Math.PI*2)
    % (Math.PI*2);

  // Pointer-এর অবস্থান -90 degree
  normalized =
    (normalized + Math.PI/2)
    % (Math.PI*2);

  let index =
    Math.floor(normalized / slice);

  if(index < 0) index = 0;
  if(index >= names.length) index = names.length-1;

  result.innerHTML =
    "💍 ভবিষ্যৎ বউয়ের নাম:<br><br>" +
    "❤️ " + names[index] +
    " ❤️";

}

</script>

</body>
</html>
