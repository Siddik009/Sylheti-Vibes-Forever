<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💍 Future Wife Spin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3,#8e44ad);
}

.game{
  width:100%;
  max-width:500px;
  text-align:center;
  padding:20px;
}

h1{
  color:white;
  font-size:30px;
  text-shadow:2px 2px 5px #555;
  margin-bottom:8px;
}

.subtitle{
  color:white;
  font-size:17px;
  margin-bottom:20px;
}

.wheelBox{
  width:350px;
  height:350px;
  max-width:90vw;
  max-height:90vw;
  margin:auto;
  position:relative;
}

.wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:9px solid white;
  box-shadow:0 8px 25px rgba(0,0,0,.4);

  background:conic-gradient(
    #ff595e 0deg 36deg,
    #ffca3a 36deg 72deg,
    #8ac926 72deg 108deg,
    #1982c4 108deg 144deg,
    #6a4c93 144deg 180deg,
    #ff924c 180deg 216deg,
    #ff66c4 216deg 252deg,
    #00c9a7 252deg 288deg,
    #845ec2 288deg 324deg,
    #f9f871 324deg 360deg
  );

  transition:transform 5s cubic-bezier(.15,.8,.2,1);
  position:relative;
}

.name{
  position:absolute;
  left:25%;
  top:25%;
  width:50%;
  height:50%;
  transform-origin:50% 100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:8px;
  font-size:16px;
  font-weight:bold;
  color:#111;
}

.n1{transform:rotate(18deg) translateY(-125px);}
.n2{transform:rotate(54deg) translateY(-125px);}
.n3{transform:rotate(90deg) translateY(-125px);}
.n4{transform:rotate(126deg) translateY(-125px);}
.n5{transform:rotate(162deg) translateY(-125px);}
.n6{transform:rotate(198deg) translateY(-125px);}
.n7{transform:rotate(234deg) translateY(-125px);}
.n8{transform:rotate(270deg) translateY(-125px);}
.n9{transform:rotate(306deg) translateY(-125px);}
.n10{transform:rotate(342deg) translateY(-125px);}

.pointer{
  position:absolute;
  z-index:10;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:45px solid #222;
}

.center{
  position:absolute;
  z-index:5;
  width:65px;
  height:65px;
  border-radius:50%;
  background:white;
  border:6px solid #222;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

button{
  margin-top:25px;
  padding:15px 50px;
  border:0;
  border-radius:50px;
  background:#222;
  color:white;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px 0 #111;
}

button:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #111;
}

button:disabled{
  opacity:.6;
}

#result{
  margin-top:20px;
  background:white;
  border-radius:20px;
  padding:16px;
  min-height:58px;
  font-size:21px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

</style>
</head>

<body>

<div class="game">

<h1>💍 ভবিষ্যৎ বউ কে?</h1>

<div class="subtitle">
মজার ছলে Wheel ঘুরিয়ে দেখো 😍
</div>

<div class="wheelBox">

<div class="pointer"></div>

<div class="wheel" id="wheel">

<div class="name n1">সুমাইয়া</div>
<div class="name n2">মিম</div>
<div class="name n3">সাদিয়া</div>
<div class="name n4">নুসরাত</div>
<div class="name n5">তানজিলা</div>
<div class="name n6">জান্নাত</div>
<div class="name n7">ফারিয়া</div>
<div class="name n8">মাহি</div>
<div class="name n9">আয়েশা</div>
<div class="name n10">নিশাত</div>

<div class="center"></div>

</div>
</div>

<button id="spinBtn" onclick="spin()">
🎡 SPIN
</button>

<div id="result">
❤️ Spin করো, নাম দেখো!
</div>

</div>

<script>

let rotation = 0;
let spinning = false;

const names = [
"সুমাইয়া ❤️",
"মিম 💕",
"সাদিয়া 😍",
"নুসরাত 💖",
"তানজিলা 🥰",
"জান্নাত 💍",
"ফারিয়া ❤️",
"মাহি 😘",
"আয়েশা 💕",
"নিশাত 💖"
];

function spin(){

if(spinning) return;

spinning = true;

const wheel = document.getElementById("wheel");
const button = document.getElementById("spinBtn");
const result = document.getElementById("result");

button.disabled = true;

result.innerHTML = "🎡 Wheel ঘুরছে... 😍";

const random = Math.floor(Math.random()*360);

rotation += 360 * 7 + random;

wheel.style.transform =
"rotate("+rotation+"deg)";

setTimeout(function(){

const finalAngle =
(360 - (rotation % 360)) % 360;

const index =
Math.floor(finalAngle / 36);

result.innerHTML =
"💍 ভবিষ্যৎ বউয়ের নাম: <br><br>❤️ "
+ names[index];

button.disabled = false;
spinning = false;

},5000);

}

</script>

</body>
</html>
