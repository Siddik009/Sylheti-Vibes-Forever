<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💍 ভবিষ্যৎ বউ কে?</title>

<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:Arial,"Noto Sans Bengali",sans-serif;

  background:
    linear-gradient(
      135deg,
      #ff7195 0%,
      #ff4f9a 45%,
      #8d4de8 100%
    );

  display:flex;
  justify-content:center;
  align-items:center;

  overflow-x:hidden;
}


/* =========================
   BACKGROUND TEXT
========================= */

.bgText{
  position:fixed;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(-18deg);

  font-size:48px;
  font-weight:900;

  color:rgba(255,255,255,0.13);

  letter-spacing:2px;

  white-space:nowrap;

  pointer-events:none;
  user-select:none;

  z-index:0;
}


/* =========================
   GAME
========================= */

.game{
  position:relative;
  z-index:2;

  width:100%;
  max-width:520px;

  text-align:center;

  padding:
    20px
    10px
    35px;
}


/* =========================
   TITLE
========================= */

h1{
  color:white;

  font-size:32px;

  margin:
    5px
    0
    8px;

  text-shadow:
    2px 3px 4px #a52b62;
}

.subtitle{
  color:white;

  font-size:18px;

  margin-bottom:20px;

  text-shadow:
    1px 2px 3px rgba(0,0,0,.25);
}


/* =========================
   WHEEL AREA
========================= */

.wheelArea{

  position:relative;

  width:min(94vw,420px);

  aspect-ratio:1;

  margin:auto;
}


/* =========================
   CANVAS
========================= */

#wheel{

  width:100%;
  height:100%;

  display:block;

  filter:
    drop-shadow(
      0 8px 8px
      rgba(0,0,0,.30)
    );
}


/* =========================
   POINTER
========================= */

.pointer{

  position:absolute;

  z-index:10;

  top:-4px;

  left:50%;

  transform:
    translateX(-50%);

  width:0;
  height:0;

  border-left:
    23px solid transparent;

  border-right:
    23px solid transparent;

  border-top:
    52px solid #222;
}


/* Pointer red circle */

.pointer:after{

  content:"";

  position:absolute;

  width:34px;
  height:34px;

  border-radius:50%;

  background:#ff1760;

  border:5px solid white;

  left:-17px;

  top:-48px;
}


/* =========================
   SPIN BUTTON
========================= */

.spinBtn{

  margin-top:25px;

  width:270px;

  max-width:80%;

  padding:
    17px
    25px;

  border:0;

  border-radius:50px;

  background:#222;

  color:white;

  font-size:24px;

  font-weight:bold;

  box-shadow:
    0 7px 0 #111;

  cursor:pointer;

  transition:
    transform .1s;
}

.spinBtn:active{

  transform:
    translateY(5px);

  box-shadow:
    0 2px 0 #111;
}

.spinBtn:disabled{

  opacity:.6;

  cursor:not-allowed;
}


/* =========================
   RESULT
========================= */

.result{

  margin:
    25px
    auto
    0;

  width:92%;

  min-height:90px;

  background:white;

  border-radius:22px;

  padding:
    18px
    10px;

  font-size:22px;

  font-weight:bold;

  color:#222;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.25);
}


/* =========================
   MOBILE
========================= */

@media(max-width:400px){

  h1{
    font-size:28px;
  }

  .subtitle{
    font-size:16px;
  }

  .bgText{
    font-size:34px;
  }

  .spinBtn{
    font-size:21px;
  }

  .result{
    font-size:20px;
  }

}

</style>
</head>


<body>


<!-- =========================
     BACKGROUND TEXT
========================= -->

<div class="bgText">

========================= -->

    💍 ভবিষ্যৎ বউ কে?
  </h1>


  <div class="subtitle">
    মজার ছলে Wheel ঘুরিয়ে দেখো! 😍
  </div>

  <div class="wheelArea">

    <div class="pointer"></div>

    <canvas

  <!-- SPIN BUTTON -->

  <button

  <!-- RESULT -->

  <div
    class="result"

</div>
