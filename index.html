<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sylheti Vibes Forever - Lucky Draw</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:600px;
  margin:auto;
  text-align:center;
}

h1{
  font-size:30px;
  margin:10px 0 5px;
}

.subtitle{
  font-size:16px;
  opacity:.9;
  margin-bottom:20px;
}

.card{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(10px);
  margin-bottom:20px;
}

.winner{
  background:white;
  color:#222;
  border-radius:15px;
  padding:18px;
  margin:12px 0;
  font-size:20px;
  font-weight:bold;
  display:none;
  animation:pop .5s ease;
}

.winner span{
  display:block;
  font-size:15px;
  color:#666;
  margin-bottom:5px;
}

.first{
  border:4px solid #ffd700;
}

.second{
  border:4px solid #c0c0c0;
}

.third{
  border:4px solid #cd7f32;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:14px;
  background:#00c853;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.count{
  margin-top:15px;
  font-size:15px;
}

.names{
  margin-top:20px;
  text-align:left;
  max-height:300px;
  overflow:auto;
  background:rgba(0,0,0,.15);
  border-radius:12px;
  padding:10px;
}

.name{
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

@keyframes pop{
  from{
    transform:scale(.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🎉 Sylheti Vibes Forever 🎉</h1>
  <div class="subtitle">Lucky Draw — ৩ জন বিজয়ী</div>

  <div class="card">

    <div id="winner1" class="winner first">
      <span>🥇 ১ম বিজয়ী</span>
      <div id="name1"></div>
    </div>

    <div id="winner2" class="winner second">
      <span>🥈 ২য় বিজয়ী</span>
      <div id="name2"></div>
    </div>

    <div id="winner3" class="winner third">
      <span>🥉 ৩য় বিজয়ী</span>
      <div id="name3"></div>
    </div>

    <button id="drawButton" onclick="drawWinners()">
      🎲 ৩ জন বিজয়ী নির্বাচন করুন
    </button>

    <div class="count">
      অংশগ্রহণকারী: <b id="count"></b> জন
    </div>

  </div>

  <div class="card">
    <h3>👥 অংশগ্রহণকারীদের তালিকা</h3>
    <div class="names" id="namesList"></div>
  </div>

</div>

<script>

const participants = [

"Nowrin Jannat",
"Nabila Chowdhury",
"Isha's Kalamoni",
"Itz Nadiya",
"Nowrin Saima",
"Tinni Tuba",
"Jahid Hossen",
"MD Sazzad Hasan",
"Maksuda Jahan",
"Sheikh Rumi Akther",
"Trendy Clothe",
"Maherima Sultana",
"TanJila TaNu",
"Mst Raisa Akter",
"স্বপ্নের ফেরিওয়ালা",
"Priyo - সিলেট",
"QK Akther",
"Drea Mer",
"Tah Mu",
"Mst Moriom",
"Shahariya Jahan",
"Tisha Akhter",
"Rinat Hasan",
"Insiya Islam",
"Jamila Jannat",
"Tisha Jannat",
"Mimi Rahman",
"অনিশার আম্মু",
"Nasrin Monne",
"Sumaiya Jannat",
"Mim Akter"

];

document.getElementById("count").innerText = participants.length;

const list = document.getElementById("namesList");

participants.forEach((name,index)=>{
  const div = document.createElement("div");
  div.className = "name";
  div.innerText = (index + 1) + ". " + name;
  list.appendChild(div);
});

function drawWinners(){

  if(participants.length < 3){
    alert("কমপক্ষে ৩ জন অংশগ্রহণকারী লাগবে।");
    return;
  }

  const button = document.getElementById("drawButton");

  button.disabled = true;
  button.innerText = "🎲 বিজয়ী নির্বাচন হচ্ছে...";

  document.getElementById("winner1").style.display = "none";
  document.getElementById("winner2").style.display = "none";
  document.getElementById("winner3").style.display = "none";

  setTimeout(()=>{

    // তালিকার কপি তৈরি করা হচ্ছে
    let shuffled = [...participants];

    // Random Shuffle
    for(let i = shuffled.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    // প্রথম ৩ জন বিজয়ী
    const winners = shuffled.slice(0,3);

    document.getElementById("name1").innerText = winners[0];
    document.getElementById("name2").innerText = winners[1];
    document.getElementById("name3").innerText = winners[2];

    document.getElementById("winner1").style.display = "block";
    document.getElementById("winner2").style.display = "block";
    document.getElementById("winner3").style.display = "block";

    button.disabled = false;
    button.innerText = "🔄 আবার ৩ জন নির্বাচন করুন";

  },1500);
}

</script>

</body>
</html>
